# ======= Framework =======
framework: playwright
source: playwright:ins-tests:sdk-v1

# ======= Credentials =======
# Never write credentials here: the SDK reads them from BROWSERSTACK_USERNAME and BROWSERSTACK_ACCESS_KEY (.env locally, CDP secrets on CDP).
# userName: <BROWSERSTACK_USERNAME>
# accessKey: <BROWSERSTACK_ACCESS_KEY>

# ======= Project Details =======
projectName: trade-imports-ins-tests

# Generated by bin/run-browserstack.ts: local, github or cdp-<ENVIRONMENT>.
# buildName: <generated>

# Generated by bin/run-browserstack.ts: the CDP or GitHub run id, or a UTC time.
# buildIdentifier: <generated>

# ======= Platforms (Browser and Device Combinations) =======
platforms:
  - browserName: edge
    os: Windows
    osVersion: 11
    browserVersion: latest
  - browserName: playwright-webkit
    os: OS X
    osVersion: Golden Gate
    browserVersion: latest
  - browserName: safari
    osVersion: 27
    deviceName: iPhone 18 Pro
  - browserName: safari
    osVersion: 26
    deviceName: iPhone 17

# ======= Local Connectivity =======
# Generated by bin/run-browserstack.ts: always true, so BrowserStack can reach CDP hostnames and localhost.
# browserstackLocal: <generated>

# ======= Parallels per Platform =======
# Generated by bin/run-browserstack.ts: one session per CPU, shared across the platforms, at least 1 per platform and at most the team-wide limit of 13 sessions in all, or BROWSERSTACK_PARALLELS_PER_PLATFORM if set.
# parallelsPerPlatform: <generated>

# ======= Debugging =======
debug: false
# Off: network logs keep every request's headers, sign-in cookies included, on BrowserStack for 30 days.
networkLogs: false
networkLogsOptions: false
video: true
interactiveDebugging: true
consoleLogs: errors
playwrightLogs: true

# ======= Test Reporting =======
testObservability: true
